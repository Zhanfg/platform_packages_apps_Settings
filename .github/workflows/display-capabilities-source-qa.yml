name: Display Capability Guard QA

on:
  push:
    branches: ["fix/**"]
    paths:
      - "src/com/android/settings/display/RefreshRateUtils.java"
      - "src/com/android/settings/display/RefreshRateSettings.java"
      - "src/com/android/settings/display/DisplayCapabilitiesPreferenceController.java"
      - "res/xml/display_settings.xml"
      - "res/values/custom_strings.xml"
      - "res/values-zh-rCN/uwu_strings.xml"
      - "tools/qa/test_real_display_capabilities.py"
      - "tools/qa/test_op6_hdr_switch.py"
      - "src/com/android/settings/display/Op6HdrContentPreferenceController.java"
      - ".github/workflows/display-capabilities-source-qa.yml"
  pull_request:
    paths:
      - "src/com/android/settings/display/**"
      - "res/xml/display_settings.xml"
      - "res/values/custom_strings.xml"
      - "res/values-zh-rCN/uwu_strings.xml"
      - "tools/qa/test_real_display_capabilities.py"
      - "tools/qa/test_op6_hdr_switch.py"
      - "src/com/android/settings/display/Op6HdrContentPreferenceController.java"
      - ".github/workflows/display-capabilities-source-qa.yml"

permissions:
  contents: read

jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            src/com/android/settings/display
            res/xml/display_settings.xml
            res/values/custom_strings.xml
            res/values-zh-rCN/uwu_strings.xml
            tools/qa/test_real_display_capabilities.py
            tools/qa/test_op6_hdr_switch.py
          sparse-checkout-cone-mode: false
      - name: Validate real display mode gating
        run: |
          python3 -m unittest discover -s tools/qa -p "test_real_display_capabilities.py" -v
          python3 -m unittest discover -s tools/qa -p "test_op6_hdr_switch.py" -v
